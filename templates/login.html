<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login | Smart Attendance</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      body {
        background: linear-gradient(120deg, #0f172a, #1e293b);
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 35px;
        min-width: 350px;
        text-align: center;
        color: white;
      }

      .login-box h3 {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .input-box {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
        padding: 12px;
        border-radius: 10px;
      }

      .input-box::placeholder {
        color: #cbd5e1;
      }

      .btn-login {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        background: #06b6d4;
      }
      .btn-login:hover {
        background: #0891b2;
      }

      .logo-circle {
        width: 80px;
        height: 80px;
        background: #06b6d4;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        margin: auto;
        margin-bottom: 15px;
      }
      small {
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="login-box shadow-lg">
      <div class="logo-circle">🔐</div>

      <h3>Admin Login</h3>
      <small>Secure Access Panel</small><br /><br />

      <form method="POST">
        <input
          class="form-control input-box mb-3"
          type="text"
          name="username"
          placeholder="👤 Username"
          required
        />

        <input
          class="form-control input-box mb-3"
          type="password"
          name="password"
          placeholder="🔑 Password"
          required
        />

        <button class="btn btn-login mt-1">Login</button>
      </form>

      <p class="mt-3" style="font-size: 13px; opacity: 0.8">
        © Smart Attendance System
      </p>
    </div>

    {% if error %}
    <script>
      Swal.fire({
        icon: "error",
        title: "Login Failed",
        text: "{{ error }}",
        confirmButtonColor: "#EF4444",
      });
    </script>
    {% endif %}
  </body>
</html>
