<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Attendance Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      body {
        font-family: system-ui, Segoe UI, Roboto, Arial;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 12px;
      }
      .card {
        background: #111827;
        border-radius: 14px;
        padding: 18px;
        border: 1px solid #1f2937;
      }
      .kpi {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 14px;
      }
      .kpi .n {
        font-size: 28px;
        font-weight: 800;
        color: #fff;
      }
      .kpi .l {
        font-size: 13px;
        color: #9ca3af;
        margin-top: -2px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">📊 Attendance Dashboard</h3>
        <div class="text-end small text-secondary">{{ datetoday2 }}</div>
      </div>

      <!-- KPIs -->
      <div class="row g-3 mb-3">
        <div class="col-md-3">
          <div class="kpi">
            <div>🟢</div>
            <div>
              <div class="n">{{ present_today }}</div>
              <div class="l">Present Today</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="kpi">
            <div>🔴</div>
            <div>
              <div class="n">{{ absent_today }}</div>
              <div class="l">Absent Today</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="kpi">
            <div>👥</div>
            <div>
              <div class="n">{{ total_users }}</div>
              <div class="l">Total Users</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="kpi">
            <div>📈</div>
            <div>
              <div class="n">{{ present_rate }}%</div>
              <div class="l">Attendance Rate</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card">
            <h6 class="mb-2">Daily Attendance Trend</h6>
            <canvas id="lineChart" height="120"></canvas>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card">
            <h6 class="mb-2">Present vs Absent (Today)</h6>
            <canvas id="pieChart" height="120"></canvas>
          </div>
        </div>
        <div class="col-12">
          <div class="card">
            <h6 class="mb-2">Top Attendees</h6>
            <canvas id="barChart" height="120"></canvas>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
      </div>
    </div>

    <script>
      // Safe JSON from Flask
      const lineLabels = {{ line_labels | default([]) | tojson | safe }};
      const lineCounts = {{ line_counts | default([]) | tojson | safe }};
      const topNames   = {{ top_names   | default([]) | tojson | safe }};
      const topCounts  = {{ top_counts  | default([]) | tojson | safe }};
      const presentToday = {{ present_today | default(0) }};
      const absentToday  = {{ absent_today  | default(0) }};

      // Line
      new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: { labels: lineLabels, datasets: [{ label:'Unique attendees per day', data: lineCounts, tension:0.35 }] },
        options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }}}}
      });

      // Pie
      new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: { labels: ['Present','Absent'], datasets: [{ data: [presentToday, absentToday] }]},
        options: { plugins:{legend:{position:'bottom'}}}
      });

      // Bar
      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: { labels: topNames, datasets: [{ label:'Total days present', data: topCounts }]},
        options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }}}}
      });
    </script>
  </body>
</html>
